# Enterprise IM Backend Default Configuration
# Override sensitive values via environment variables (e.g. MYSQL_PASSWORD, REDIS_PASSWORD).
app:
  name: enterprise-im
  env: development # development | production
  node_id: node-1

server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 15s
  max_body_bytes: 1048576

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

ws:
  heartbeat_timeout: 75s
  write_timeout: 5s
  max_frame_bytes: 1048576

log:
  level: info # debug | info | warn | error
  format: json # json | text

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "" # Set via MYSQL_PASSWORD or IM_MYSQL_PASSWORD
  database: enterprise_im
  charset: utf8mb4
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  dial_timeout: 5s

redis:
  addr: 127.0.0.1:6379
  password: "" # Set via REDIS_PASSWORD or IM_REDIS_PASSWORD
  db: 0
  pool_size: 50
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

snowflake:
  node_id: 1

jwt:
  secret: "replace-with-32byte-jwt-secret-in-env" # Placeholder only; set JWT_SECRET or IM_JWT_SECRET in runtime/production
  issuer: enterprise-im
  access_ttl: 15m
  refresh_ttl: 168h

auth:
  max_sessions_per_user: 5
  bcrypt_cost: 10

health:
  probe_timeout: 2s

upload:
  dir: ./uploads
  temp_dir: "" # Defaults to <upload.dir>/.tmp on the same filesystem for atomic rename
  max_image_bytes: 10485760 # 10 MiB
  max_file_bytes: 52428800 # 50 MiB
  max_voice_bytes: 10485760 # 10 MiB
  max_avatar_bytes: 5242880 # 5 MiB
  max_image_width: 8192
  max_image_height: 8192
  max_image_pixels: 25000000 # 25 MP decompression-bomb guard
  max_voice_duration_ms: 300000 # 5 minutes
  thumbnail_max_dim: 320
  download_url_ttl: 15m

chat:
  recall_window: 2m
  direct_push_fallback: false # Transition-only fallback; default false routes msg.push via im:stream:messages -> im-msg-deliver
